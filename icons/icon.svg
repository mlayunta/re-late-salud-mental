    <path d="M49 50 C54 52 53 57 49 59" stroke-width="2"/>
    <path d="M58 47 C62 50 58 54 61 57" stroke-width="2"/>
    <path d="M67 49 C71 52 67 56 70 58" stroke-width="2"/>
    <path d="M44 56 C48 57 49 61 46.5 64" stroke-width="2"/>
    <path d="M77 54 C73.5 55.5 74 59.5 77 61" stroke-width="2"/>
