<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="512" height="512" role="img" aria-labelledby="t d">
<title id="t">Re-Late</title>
<desc id="d">Cerebro en crema dentro de un corazón coral, sobre fondo verde: salud mental cuidada. Re-Late · Zaragoza.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#43ab82"/><stop offset="1" stop-color="#1b5744"/>
  </linearGradient>
  <linearGradient id="hr" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ff9078"/><stop offset="1" stop-color="#d8402c"/>
  </linearGradient>
  <radialGradient id="halo" cx=".5" cy=".45" r=".55">
    <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
</defs>

<!-- fondo full-bleed: también vale como icono maskable -->
<rect width="120" height="120" rx="26" fill="url(#bg)"/>

<g transform="translate(9 9) scale(.85)">
