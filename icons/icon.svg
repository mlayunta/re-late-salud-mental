  <path d="M31 42 c-3 7 1 14 7 19" stroke="#fff" stroke-opacity=".38" stroke-width="3.4" fill="none" stroke-linecap="round"/>

  <!-- cerebro -->
  <g fill="#fff6ea" stroke="#c9503a" stroke-opacity=".30" stroke-width="1.3">
    <path d="M65 71 C64 75 66 78 68 80" fill="none" stroke="#fff6ea" stroke-width="4.6" stroke-linecap="round"/>
    <circle cx="71" cy="68" r="6.2"/>
