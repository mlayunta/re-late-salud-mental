<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sin conexión · Re-Late</title>
<style>
:root{--bg:#f6f4ef;--panel:#fff;--ink:#26302c;--muted:#5c6b64;--brand:#2f7d63;--line:#e3ded4}
@media(prefers-color-scheme:dark){:root{--bg:#151b19;--panel:#1d2522;--ink:#e8ede9;--muted:#a9b7b0;--line:#2c3733}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
 font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial,sans-serif;padding:24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;max-width:460px;text-align:center;
 box-shadow:0 10px 30px rgba(38,48,44,.08)}
h1{font-size:1.3em;margin:0 0 8px}
p{color:var(--muted);line-height:1.6}
a.btn{display:inline-block;margin-top:14px;background:var(--brand);color:#fff;text-decoration:none;padding:11px 18px;border-radius:12px;font-weight:700}
</style>
</head>
<body>
<div class="card">
  <h1>Sin conexión</h1>
  <p>Re-Late funciona <b>sin internet</b>: tus datos están en este dispositivo. Vuelve a abrir la app desde el icono instalado o reintenta la conexión.</p>
  <p><b>Si es una urgencia:</b> llama al <a href="tel:112">112</a> o al <a href="tel:024">024</a>.</p>
  <a class="btn" href="./index.html">Reintentar</a>
</div>
</body>
</html>
